services:
  postgres:
    image: postgres:16-alpine
    container_name: batteryx-postgres
    environment:
      POSTGRES_USER: batteryx
      POSTGRES_PASSWORD: batteryx
      POSTGRES_DB: batteryx
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U batteryx -d batteryx"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: batteryx-app
    environment:
      DATABASE_URL: "postgresql://batteryx:batteryx@postgres:5432/batteryx?schema=public"
      JWT_SECRET: "change-this-to-a-long-random-string-for-development"
      JWT_EXPIRES_IN: "8h"
      PORT: "5173"
      NODE_ENV: "development"
    ports:
      - "5173:5173"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
